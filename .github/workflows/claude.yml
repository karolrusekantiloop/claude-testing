name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model claude-haiku-4-5
            --allowedTools "Bash(gh pr diff:*)"
          prompt: |
            Review the changes in this pull request.
            Run: gh pr diff ${{ github.event.pull_request.number }}

            Focus on:
            - HTML correctness
            - Accessibility
            - Best practices
            - Readability
            - Potential bugs

            Post your findings as a PR review comment.