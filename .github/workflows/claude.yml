name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-haiku-4-5
          prompt: |
            Review the changes in this pull request by reading the git diff.
            Run: git diff origin/main...HEAD

            Focus on:
            - HTML correctness
            - Accessibility
            - Best practices
            - Readability
            - Potential bugs

            Post your findings as a PR review comment.